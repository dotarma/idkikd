# ╔══════════════════════════════════════════════════════════════╗
# ║  alacritty.toml — riced config                              ║
# ║  Theme  : Catppuccin Mocha                                  ║
# ║  Font   : JetBrains Mono 10                                 ║
# ║  Blur   : via opacity + picom dual_kawase                   ║
# ║  Place  : ~/.config/alacritty/alacritty.toml                ║
# ╚══════════════════════════════════════════════════════════════╝

[window]
padding          = { x = 14, y = 12 }
dynamic_padding  = true
decorations      = "None"
opacity          = 0.82
startup_mode     = "Windowed"
title            = "Alacritty"
dynamic_title    = true

[scrolling]
history    = 10000
multiplier = 3

[font]
size = 10.0

[font.normal]
family = "JetBrains Mono"
style  = "Regular"

[font.bold]
family = "JetBrains Mono"
style  = "Bold"

[font.italic]
family = "JetBrains Mono"
style  = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style  = "Bold Italic"

[font.offset]
x = 0
y = 2

[font.glyph_offset]
x = 0
y = 1

[cursor]
style            = { shape = "Block", blinking = "On" }
blink_interval   = 600
blink_timeout    = 8
unfocused_hollow = true
thickness        = 0.15

[selection]
save_to_clipboard = true

[mouse]
hide_when_typing = true

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"

[colors.cursor]
text   = "#1e1e2e"
cursor = "#f5e0dc"

[colors.vi_mode_cursor]
text   = "#1e1e2e"
cursor = "#b4befe"

[colors.search.matches]
foreground = "#1e1e2e"
background = "#a6adc8"

[colors.search.focused_match]
foreground = "#1e1e2e"
background = "#a6e3a1"

[colors.selection]
text       = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black   = "#45475a"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#bac2de"

[colors.bright]
black   = "#585b70"
red     = "#f38ba8"
green   = "#a6e3a1"
yellow  = "#f9e2af"
blue    = "#89b4fa"
magenta = "#f5c2e7"
cyan    = "#94e2d5"
white   = "#a6adc8"

[[keyboard.bindings]]
key    = "Return"
mods   = "Control|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key    = "C"
mods   = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key    = "V"
mods   = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key    = "Plus"
mods   = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key    = "Minus"
mods   = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key    = "Key0"
mods   = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key    = "F11"
action = "ToggleFullscreen"

[[keyboard.bindings]]
key    = "K"
mods   = "Control|Shift"
action = "ScrollLineUp"

[[keyboard.bindings]]
key    = "J"
mods   = "Control|Shift"
action = "ScrollLineDown"

[[keyboard.bindings]]
key    = "U"
mods   = "Control|Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key    = "D"
mods   = "Control|Shift"
action = "ScrollPageDown"

[[keyboard.bindings]]
key    = "Space"
mods   = "Control|Shift"
action = "ToggleViMode"
