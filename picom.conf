# ╔══════════════════════════════════════════════════════════════╗
# ║  picom.conf — blur + square corners                         ║
# ║  Requires: picom-jonaburg-git or picom-pijulius-git (AUR)   ║
# ║  Place at: ~/.config/picom/picom.conf                       ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Backend ───────────────────────────────────────────────────
backend     = "glx";
vsync       = true;
use-damage  = false;

# ── Corners — Square ──────────────────────────────────────────
corner-radius = 0;

# ── Blur ──────────────────────────────────────────────────────
blur-method   = "dual_kawase";
blur-strength = 8;
blur-background         = true;
blur-background-frame   = true;
blur-background-fixed   = false;

blur-background-exclude = [
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "class_g = 'i3bar'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Shadows ───────────────────────────────────────────────────
shadow         = true;
shadow-radius  = 14;
shadow-opacity = 0.4;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g = 'slop'",
    "class_g = 'i3bar'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# ── Fading ────────────────────────────────────────────────────
fading         = true;
fade-in-step   = 0.06;
fade-out-step  = 0.06;
fade-delta     = 5;

# ── Opacity ───────────────────────────────────────────────────
inactive-opacity          = 0.92;
active-opacity            = 1.0;
inactive-opacity-override = false;
frame-opacity             = 1.0;

opacity-rule = [
    "100:class_g = 'firefox'",
    "100:class_g = 'Firefox'",
    "100:class_g = 'mpv'",
    "100:fullscreen"
];

# ── Other ─────────────────────────────────────────────────────
mark-wmwin-focused    = true;
mark-ovredir-focused  = true;
detect-rounded-corners = false;
detect-client-opacity = true;
detect-transient      = true;
detect-client-leader  = true;
log-level             = "warn";

# ── Window types ──────────────────────────────────────────────
wintypes: {
    tooltip      = { fade = true; shadow = false; opacity = 0.9; focus = true; };
    dock         = { shadow = false; blur-background = false; };
    dnd          = { shadow = false; };
    popup_menu   = { opacity = 0.95; blur-background = true; };
    dropdown_menu = { opacity = 0.95; blur-background = true; };
};
