;  ╔══════════════════════════════════════════════════════════════╗
;  ║  polybar config — illogical-impulse style                  ║
;  ║  Theme  : Catppuccin Mocha                                 ║
;  ║  Font   : JetBrains Mono / Nerd Font icons                 ║
;  ║  WM     : i3                                               ║
;  ║  Place  : ~/.config/polybar/config.ini                     ║
;  ╚══════════════════════════════════════════════════════════════╝

; ── Launch script ─────────────────────────────────────────────
; Create ~/.config/polybar/launch.sh:
;   #!/bin/bash
;   killall -q polybar
;   while pgrep -u $UID -x polybar >/dev/null; do sleep 0.1; done
;   polybar main 2>&1 | tee -a /tmp/polybar.log &

; ══════════════════════════════════════════════════════════════
; COLORS — Catppuccin Mocha
; ══════════════════════════════════════════════════════════════
[colors]
base     = #1e1e2e
mantle   = #181825
crust    = #11111b
surface0 = #313244
surface1 = #45475a
surface2 = #585b70
overlay0 = #6c7086
overlay1 = #7f849c
overlay2 = #9399b2
subtext0 = #a6adc8
subtext1 = #bac2de
text     = #cdd6f4

rosewater = #f5e0dc
flamingo  = #f2cdcd
pink      = #f5c2e7
mauve     = #cba6f7
red       = #f38ba8
maroon    = #eba0ac
peach     = #fab387
yellow    = #f9e2af
green     = #a6e3a1
teal      = #94e2d5
sky       = #89dceb
sapphire  = #74c7ec
blue      = #89b4fa
lavender  = #b4befe

transparent = #00000000

; ══════════════════════════════════════════════════════════════
; MAIN BAR
; ══════════════════════════════════════════════════════════════
[bar/main]
monitor               = ${env:MONITOR:}
width                 = 100%
height                = 32
offset-x              = 0
offset-y              = 0
radius                = 0

; Colours
background            = #cc1e1e2e
foreground            = ${colors.text}

; Border
border-size           = 0
border-color          = ${colors.transparent}

; Separator between modules
separator             = "  "
separator-foreground  = ${colors.surface1}

; Padding
padding-left          = 2
padding-right         = 2
module-margin-left    = 0
module-margin-right   = 0

; ── Fonts ─────────────────────────────────────────────────────
; font-N = <name>:<style>:size=N;vertical-offset
font-0 = JetBrains Mono:style=Regular:size=10;3
font-1 = JetBrains Mono:style=Bold:size=10;3
font-2 = JetBrains Mono:style=Regular:size=13;4
font-3 = JetBrains Mono:style=Regular:size=8;2

; ── Module layout ─────────────────────────────────────────────
modules-left   = i3 xwindow
modules-center = date
modules-right  = xkeyboard pulseaudio backlight battery network cpu memory

; ── Tray ──────────────────────────────────────────────────────
tray-position     = right
tray-padding      = 4
tray-background   = ${colors.base}
tray-maxsize      = 16

; ── Misc ──────────────────────────────────────────────────────
cursor-click  = pointer
cursor-scroll = ns-resize
wm-restack    = i3
override-redirect = false
enable-ipc    = true

; ══════════════════════════════════════════════════════════════
; MODULES
; ══════════════════════════════════════════════════════════════

; ── i3 workspaces ─────────────────────────────────────────────
[module/i3]
type = internal/i3
pin-workspaces    = true
show-urgent       = true
strip-wsnumbers   = false
index-sort        = true
enable-click      = true
enable-scroll     = true
wrapping-scroll   = false
reverse-scroll    = false
fuzzy-match       = false

format = <label-state> <label-mode>

label-mode         = %mode%
label-mode-padding = 2
label-mode-foreground       = ${colors.base}
label-mode-background       = ${colors.yellow}

; focused
label-focused             = %index%
label-focused-foreground  = ${colors.base}
label-focused-background  = ${colors.blue}
label-focused-padding     = 2

; unfocused
label-unfocused            = %index%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding    = 2

; visible (on other monitor)
label-visible             = %index%
label-visible-foreground  = ${colors.subtext0}
label-visible-padding     = 2

; urgent
label-urgent             = %index%
label-urgent-foreground  = ${colors.base}
label-urgent-background  = ${colors.red}
label-urgent-padding     = 2

; ── Active window title ───────────────────────────────────────
[module/xwindow]
type             = internal/xwindow
label            = %title:0:40:…%
label-foreground = ${colors.subtext1}
label-font       = 4

format-prefix          = "  "
format-prefix-foreground = ${colors.overlay0}

; ── Date / Time ───────────────────────────────────────────────
[module/date]
type     = internal/date
interval = 5

date        = "%a %d %b"
date-alt    = "%Y-%m-%d"
time        = "%H:%M"
time-alt    = "%H:%M:%S"

format-prefix          = "󰃭  "
format-prefix-font     = 3
format-prefix-foreground = ${colors.blue}
format-foreground      = ${colors.text}

label = %date%  %time%

; ── PulseAudio volume ─────────────────────────────────────────
[module/pulseaudio]
type = internal/pulseaudio
sink = @DEFAULT_SINK@
use-ui-max    = true
interval      = 5
reverse-scroll = false

format-volume          = <ramp-volume> <label-volume>
format-volume-foreground = ${colors.text}

label-volume           = %percentage%%
label-muted            = "󰝟  muted"
label-muted-foreground = ${colors.overlay0}

ramp-volume-0          = 󰕿
ramp-volume-1          = 󰖀
ramp-volume-2          = 󰕾
ramp-volume-font       = 3
ramp-volume-foreground = ${colors.teal}

click-right = pavucontrol

; ── Backlight ─────────────────────────────────────────────────
[module/backlight]
type             = internal/backlight
card             = intel_backlight
use-actual-brightness = true
enable-scroll    = true

format          = <ramp> <label>
label           = %percentage%%

ramp-0          = 󰃞
ramp-1          = 󰃟
ramp-2          = 󰃠
ramp-font       = 3
ramp-foreground = ${colors.yellow}

; ── Battery ───────────────────────────────────────────────────
[module/battery]
type             = internal/battery
battery          = BAT0
adapter          = AC
full-at          = 99
low-at           = 15
poll-interval    = 10

format-charging          = <animation-charging> <label-charging>
format-discharging       = <ramp-capacity> <label-discharging>
format-full              = <label-full>
format-low               = <animation-low> <label-low>

label-charging           = %percentage%%
label-discharging        = %percentage%%
label-full               = "  full"
label-full-foreground    = ${colors.green}
label-low                = %percentage%%
label-low-foreground     = ${colors.red}

ramp-capacity-0          = 󰁺
ramp-capacity-1          = 󰁻
ramp-capacity-2          = 󰁽
ramp-capacity-3          = 󰁿
ramp-capacity-4          = 󰂁
ramp-capacity-5          = 󰂂
ramp-capacity-6          = 󰂃
ramp-capacity-7          = 󰂄
ramp-capacity-8          = 󰂅
ramp-capacity-9          = 󰁹
ramp-capacity-font       = 3
ramp-capacity-foreground = ${colors.green}

animation-charging-0     = 󰢜
animation-charging-1     = 󰂆
animation-charging-2     = 󰂇
animation-charging-3     = 󰂈
animation-charging-4     = 󰢝
animation-charging-font  = 3
animation-charging-foreground = ${colors.yellow}
animation-charging-framerate  = 750

animation-low-0          = 󰁺
animation-low-1          = 
animation-low-font       = 3
animation-low-foreground = ${colors.red}
animation-low-framerate  = 500

; ── Network ───────────────────────────────────────────────────
[module/network]
type             = internal/network
interface-type   = any
interval         = 3
accumulate-stats = true
unknown-as-up    = true

format-connected          = <ramp-signal> <label-connected>
format-disconnected       = <label-disconnected>
format-packetloss         = <animation-packetloss> <label-connected>

label-connected           = %essid:0:12:…%  %downspeed:6%  %upspeed:6%
label-connected-foreground = ${colors.text}
label-disconnected        = "󰤭  offline"
label-disconnected-foreground = ${colors.overlay0}

ramp-signal-0          = 󰤯
ramp-signal-1          = 󰤟
ramp-signal-2          = 󰤢
ramp-signal-3          = 󰤥
ramp-signal-4          = 󰤨
ramp-signal-font       = 3
ramp-signal-foreground = ${colors.sapphire}

animation-packetloss-0   = 󰤫
animation-packetloss-1   = 󰤭
animation-packetloss-font = 3
animation-packetloss-foreground = ${colors.red}
animation-packetloss-framerate  = 500

; ── CPU ───────────────────────────────────────────────────────
[module/cpu]
type     = internal/cpu
interval = 2
warn-percentage = 80

format          = <label>
format-prefix   = "󰻠  "
format-prefix-font = 3
format-prefix-foreground   = ${colors.mauve}
format-warn-prefix-foreground = ${colors.red}

label           = %percentage:2%%
label-warn      = %percentage:2%%
label-warn-foreground = ${colors.red}

; ── Memory ────────────────────────────────────────────────────
[module/memory]
type     = internal/memory
interval = 3
warn-percentage = 85

format          = <label>
format-prefix   = "󰍛  "
format-prefix-font = 3
format-prefix-foreground   = ${colors.pink}
format-warn-prefix-foreground = ${colors.red}

label           = %percentage_used:2%%
label-warn      = %percentage_used:2%%
label-warn-foreground = ${colors.red}

; ── Keyboard layout ───────────────────────────────────────────
[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock

format-prefix          = "  "
format-prefix-font     = 3
format-prefix-foreground = ${colors.lavender}

label-layout           = %layout%
label-layout-foreground = ${colors.text}

label-indicator-on-capslock  = " caps"
label-indicator-off-capslock = ""
label-indicator-foreground   = ${colors.yellow}
